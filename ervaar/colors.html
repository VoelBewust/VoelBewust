<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calm down</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

/* Bewegende achtergrond */
#achtergrond {
    position: fixed;
    inset: 0;
    background: linear-gradient(
        45deg,
        #ff006e,
        #8338ec,
        #3a86ff,
        #06d6a0,
        #ffbe0b,
        #fb5607
    );
    background-size: 400% 400%;
    animation: kleur 18s ease infinite;
}

@keyframes kleur {
    0% {
        background-position: 0% 50%;
    }
    50% {
        background-position: 100% 50%;
    }
    100% {
        background-position: 0% 50%;
    }
}

/* Algemene vorm */
.vorm {
    position: absolute;
    opacity: 0.55;
    filter: blur(1px);
    animation: zweef 15s infinite ease-in-out;
}

.cirkel {
    border-radius: 50%;
}

.vierkant {
    border-radius: 20px;
}

.driehoek {
    width: 0;
    height: 0;
    background: transparent;
    border-left: 70px solid transparent;
    border-right: 70px solid transparent;
    border-bottom: 120px solid white;
}

@keyframes zweef {
    0% {
        transform: translate(0,0) rotate(0deg) scale(1);
    }
    25% {
        transform: translate(100px,-100px) rotate(90deg) scale(1.3);
    }
    50% {
        transform: translate(-80px,80px) rotate(180deg) scale(0.8);
    }
    75% {
        transform: translate(120px,50px) rotate(270deg) scale(1.2);
    }
    100% {
        transform: translate(0,0) rotate(360deg) scale(1);
    }
}

/* Statusmelding */
#status {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-family: Arial, sans-serif;
    font-size: 16px;
    background: rgba(0,0,0,0.3);
    padding: 10px 20px;
    border-radius: 20px;
}
</style>
</head>

<body>

<div id="achtergrond"></div>

<!-- Bewegende vormen -->
<div class="vorm cirkel" style="
width:120px;height:120px;
background:white;
left:10%;top:20%;
animation-duration:18s;">
</div>

<div class="vorm vierkant" style="
width:90px;height:90px;
background:#00ffff;
left:70%;top:15%;
animation-duration:22s;">
</div>

<div class="vorm cirkel" style="
width:180px;height:180px;
background:#ff00ff;
left:45%;top:65%;
animation-duration:25s;">
</div>

<div class="vorm driehoek" style="
left:25%;top:60%;
animation-duration:20s;">
</div>

<div class="vorm vierkant" style="
width:70px;height:70px;
background:#ffff00;
left:80%;top:70%;
animation-duration:17s;">
</div>

<div id="status">
Tik op het scherm om Wake Lock te starten
</div>


<script>
/* Wake Lock */
let wakeLock = null;

async function activeerWakeLock() {
    try {
        if ("wakeLock" in navigator) {
            wakeLock = await navigator.wakeLock.request("screen");

            document.getElementById("status").innerHTML =
                "Scherm actief gehouden ✓";

            wakeLock.addEventListener("release", () => {
                document.getElementById("status").innerHTML =
                    "Wake Lock vrijgegeven";
            });

        } else {
            document.getElementById("status").innerHTML =
                "Wake Lock niet ondersteund in deze browser";
        }

    } catch (err) {
        document.getElementById("status").innerHTML =
            "Wake Lock mislukt";
        console.log(err);
    }
}

/* Start na gebruikersactie */
document.addEventListener(
    "click",
    activeerWakeLock,
    { once: true }
);

document.addEventListener(
    "touchstart",
    activeerWakeLock,
    { once: true }
);


/* Opnieuw aanvragen als gebruiker terugkomt */
document.addEventListener("visibilitychange", async () => {
    if (
        wakeLock !== null &&
        document.visibilityState === "visible"
    ) {
        await activeerWakeLock();
    }
});
</script>

</body>
</html>
